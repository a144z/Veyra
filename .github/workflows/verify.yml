name: Verify Veyra
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: plugin}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: '11.11.0', run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.21.0', cache: pnpm, cache-dependency-path: plugin/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        with: {name: veyra-paybox-plugin, path: plugin/dist/plugin.mjs}
