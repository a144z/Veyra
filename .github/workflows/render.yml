name: Render Veyra film
on:
  push:
    branches: [main]
    paths: ['video/**', 'src/components/PackArt.tsx', 'src/components/CardRevealSlab.tsx', 'public/**', '.github/workflows/render.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npx remotion browser ensure
      - run: npm run video:render
      - name: Render visual QA frames
        run: |
          npx remotion still video/index.ts Veyra launch/intro.png --frame=100
          npx remotion still video/index.ts Veyra launch/discover.png --frame=240
          npx remotion still video/index.ts Veyra launch/policy.png --frame=420
          npx remotion still video/index.ts Veyra launch/payment.png --frame=560
          npx remotion still video/index.ts Veyra launch/rip.png --frame=720
          npx remotion still video/index.ts Veyra launch/reveal.png --frame=850
          npx remotion still video/index.ts Veyra launch/outro.png --frame=965
          npx remotion still video/index.ts ProductDesktop launch/desktop.png
          npx remotion still video/index.ts ProductMobile launch/mobile.png
      - uses: actions/upload-artifact@v4
        with: {name: veyra-film, path: launch/, retention-days: 7}
